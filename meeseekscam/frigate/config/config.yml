# No MQTT broker / Home Assistant at this site — enable once one exists.
mqtt:
  enabled: false

# LIBVA_DRIVER_NAME in compose.yaml is set to i965 (older Intel iGPUs);
# newer generations need iHD instead.
ffmpeg:
  hwaccel_args: preset-vaapi

# One restream per camera. The `#audio=aac#audio=opus` producer transcodes the
# camera's G.711 audio into AAC (MSE player) + Opus (WebRTC) so live view has sound.
# Video stays H.264 copy — only audio is transcoded (cheap).
#
# Placeholder camera: replace XXX with the real IP and rename the env var after
# its last octet (FRIGATE_CAM<octet>_PASSWORD), as on picklecam. Duplicate the
# block per camera.
go2rtc:
  streams:
    cam1:
      - rtsp://admin:{FRIGATE_CAM1_PASSWORD}@192.168.1.XXX:554/stream1
      - ffmpeg:cam1#audio=aac#audio=opus

detectors:
  coral:
    type: edgetpu
    device: usb

# `detect.enabled` defaults to false since 0.16, so it has to be set
# explicitly — without it object detection is simply off.
detect:
  enabled: true

objects:
  track:
    - person
    - cat
    - dog

# Since 0.17 recording retention is tiered: `continuous` and `motion` are
# separate top-level fields, they replaced the old `retain: {days, mode}`.
record:
  enabled: true
  continuous:
    days: 14       # всё подряд 14 дней (scrub-back)
  alerts:
    retain:
      days: 60
      mode: motion
  detections:
    retain:
      days: 60
      mode: motion
snapshots:
  enabled: true
  retain:
    default: 90

birdseye:
  enabled: true
  mode: continuous

cameras:
  cam1:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/cam1
          input_args: preset-rtsp-restream
          roles:
            - record
            - detect
# Config schema version, not the Frigate version. Keep it at the schema the
# file is actually written for: on startup Frigate migrates anything older and
# writes the result back over this file, which would otherwise leave the copy
# in git permanently behind the one on the host.
version: 0.17-0
