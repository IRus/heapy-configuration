services:
  wireguard:
    container_name: "wireguard"
    image: "ghcr.io/wg-easy/wg-easy:15"
    restart: "always"
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
    volumes:
      - "./wireguard/data/:/etc/wireguard"
    logging:
      driver: "journald"
    stop_grace_period: 30s
    ports:
      - "51820:51820/udp"
      # Local backend for Tailscale Serve.
      - "127.0.0.1:51821:51821/tcp"
    cap_add:
      - "NET_ADMIN"
      - "SYS_MODULE"
    sysctls:
      - "net.ipv4.conf.all.src_valid_mark=1"
      - "net.ipv4.ip_forward=1"
